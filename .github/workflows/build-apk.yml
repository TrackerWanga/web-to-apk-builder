name: Build APK from URL

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Website URL"
        required: true
      app_name:
        description: "App Name"
        required: true
      package_id:
        description: "Package ID (e.g. com.megan.test)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate project
        env:
          URL: ${{ inputs.website_url }}
          NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_id }}
        run: |
          mkdir -p app/src/main/java/com/megan/webapk
          mkdir -p app/src/main/res/mipmap-hdpi
          echo 'rootProject.name = "WebAPK"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          printf "buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }\n}\nallprojects { repositories { google(); mavenCentral() } }\n" > build.gradle
          printf "plugins { id 'com.android.application' }\nandroid {\n  namespace '\$PKG'\n  compileSdk 34\n  defaultConfig {\n    applicationId '\$PKG'\n    minSdk 21\n    targetSdk 34\n  }\n}\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > app/build.gradle
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <uses-permission android:name=\"android.permission.INTERNET\" />\n  <application android:label=\"\$NAME\" android:usesCleartextTraffic=\"true\">\n    <activity android:name=\".MainActivity\" android:exported=\"true\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package \$PKG;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n  @Override protected void onCreate(Bundle b) {\n    super.onCreate(b);\n    WebView w = new WebView(this);\n    w.getSettings().setJavaScriptEnabled(true);\n    w.setWebViewClient(new WebViewClient());\n    w.loadUrl(\"\$URL\");\n    setContentView(w);\n  }\n}\n" > app/src/main/java/com/megan/webapk/MainActivity.java
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
